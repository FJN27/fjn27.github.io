
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bootcamp for Science</title>

    <!-- Google Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap"
        rel="stylesheet">

    <!-- Shared stylesheet -->
    <link rel="stylesheet" href="/style.css">

    <style>
        /* ---------- General ---------- */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: #111;
            background-color: white;
        }

        /* ---------- Main homepage ---------- */

        main {
            max-width: 1200px;
            margin: auto;
            padding: 0 30px;
        }

        .hero {
            min-height: 500px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .hero h1 {
            font-family: Georgia, serif;
            font-size: 52px;
            font-weight: normal;
            margin: 0 0 35px;
        }

        .hero p {
            font-family: Georgia, serif;
            font-size: 22px;
            margin: 0 0 30px;
        }

        .about-button {
            display: inline-block;
            padding: 16px 25px;

            background-color: #111;
            color: white;

            font-family: Georgia, serif;
            font-size: 18px;

            text-decoration: none;
            border-radius: 6px;
        }

        .about-button:hover {
            background-color: #333;
        }

        /* ---------- Mobile ---------- */

        @media (max-width: 700px) {

            .hero h1 {
                font-size: 38px;
            }

            .hero p {
                font-size: 19px;
            }
        }

    </style>
</head>

<body>

    <!-- Shared navigation bar -->
    <div id="navbar"></div>

    <!-- Main content -->
    <main>

        <section class="hero">

            <h1>Bootcamp for Science</h1>

            <p>
                Math, Physics, and Chemistry
            </p>

            <a class="about-button" href="/about.html">
                About us
            </a>

        </section>

    </main>

    <!-- Load shared navigation -->
    <script src="/script.js"></script>

</body>

</html>
